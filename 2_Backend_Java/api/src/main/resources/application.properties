# ===============================================
# =           DATABASE CONFIGURATION          =
# ===============================================
# URL de connexion à la base de données MySQL.
# Assurez-vous que le nom de la base (smart_parking) est correct.
spring.datasource.url=jdbc:mysql://localhost:3306/smart_parking?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Identifiants de la base de données
spring.datasource.username=root
# Laissez vide si votre utilisateur 'root' n'a pas de mot de passe.
# Si vous avez un mot de passe, mettez-le ici.
spring.datasource.password=

# ===============================================
# =         JPA/HIBERNATE CONFIGURATION         =
# ===============================================
# 'update' : Hibernate met à jour le schéma de la base de données au démarrage.
# Pratique en développement, mais à utiliser avec prudence en production.
spring.jpa.hibernate.ddl-auto=update

# Affiche les requêtes SQL générées par Hibernate dans la console.
# Très utile pour le débogage.
spring.jpa.show-sql=true

# Il n'est plus nécessaire de spécifier le dialecte, Spring Boot le détecte
# automatiquement. Je laisse la ligne commentée pour information.
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
